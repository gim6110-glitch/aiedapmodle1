name: Verify Module1 app
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check src/main.js
          node --check netlify/functions/api.mjs
          node --check src/hwpx.js
      - name: Verify administrator password lifecycle
        run: node --test tests/admin-auth.test.mjs
      - name: Production build
        run: npm run build
      - name: Assert published entrypoints exist
        run: |
          test -s dist/index.html
          test -s dist/admin.html
          test -d dist/assets
          test -s dist/slides.json
          test -s dist/slides-images.json
          echo "Main and admin entrypoints and slides ready."
